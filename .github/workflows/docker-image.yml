name: Build and Publish

on:
  workflow_call:
    inputs:
      snapshot_ref:
        description: Commit containing the refreshed LAHD snapshot
        required: true
        type: string
  push:
    branches: [ "master" ]
    paths-ignore:
      - '.gitignore'
      - '.github/**'

permissions:
  contents: read

jobs:
  build-and-push-docker-image:
    name: Build Docker image and push to repositories
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          filter: blob:none
          ref: ${{ inputs.snapshot_ref || github.sha }}

      - name: Collect sitemap modification dates
        id: sitemap
        run: echo "lastmod=$(python3 scripts/sitemap_lastmod.py)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to DockerHub
        if: github.event_name == 'push' || inputs.snapshot_ref != ''
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PAT }}

      - name: Login to Docker Hardened Images
        if: github.event_name == 'push' || inputs.snapshot_ref != ''
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: dhi.io
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PAT }}

      - name: Build image and push to Docker Hub
        id: docker_build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          build-args: |
            SITE_PAGE_LASTMOD=${{ steps.sitemap.outputs.lastmod }}
          tags: |
            strayingfromthepath/larentals:latest
          push: ${{ github.event_name == 'push' || inputs.snapshot_ref != '' }}
          no-cache: true

      - name: Image digest
        if: github.event_name == 'push' || inputs.snapshot_ref != ''
        run: echo ${{ steps.docker_build.outputs.digest }}
