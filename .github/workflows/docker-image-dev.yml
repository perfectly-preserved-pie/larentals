name: Build and Publish - Dev Build

on:
  push:
    branches: [ "dev" ]
    paths-ignore:
      - '*.md'
      - 'dataframe.pickle'
      - '.gitignore'
      - '.github/**'
  schedule:
    - cron: '35 10 * * 5'

permissions:
  contents: read

jobs:
  # define job to build and publish docker image
  build-and-push-docker-image:
    name: Build Docker image and push to repositories
    # run only when code is compiling and tests are passing
    runs-on: ubuntu-latest

    # steps to perform in job
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          filter: blob:none

      - name: Collect sitemap modification dates
        id: sitemap
        run: echo "lastmod=$(python3 scripts/sitemap_lastmod.py)" >> "$GITHUB_OUTPUT"

      # setup Docker buld action
      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to DockerHub
        if: github.event_name == 'push'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PAT }}

      - name: Login to Docker Hardened Images
        if: github.event_name == 'push'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: dhi.io
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PAT }}

      - name: Build image and push to Docker Hub 
        id: docker_build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          # relative path to the place where source code with Dockerfile is located
          context: .
          build-args: |
            SITE_PAGE_LASTMOD=${{ steps.sitemap.outputs.lastmod }}
          # Note: tags has to be all lower-case
          tags: |
            strayingfromthepath/larentals:dev
          # build on PRs, push only on direct pushes to dev
          push: ${{ github.event_name == 'push' }}

      - name: Image digest
        if: github.event_name == 'push'
        run: echo ${{ steps.docker_build.outputs.digest }}
